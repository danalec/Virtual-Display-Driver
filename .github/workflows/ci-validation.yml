---
name: Build Virtual Display Driver

on:
  pull_request:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  VDD_SOLUTION: Virtual Display Driver (HDR)/MttVDD.sln

permissions:
  contents: read

jobs:
  build:
    # The WDK driver build is validated against VS 2022; windows-latest is moving to VS 2026.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        # Debug belongs here because the analyses that matter run there. A C4754 in dispinfo()
        # only ever surfaced in the Debug configurations, and TreatWarningAsError is on in every
        # configuration -- so building Release alone left the stricter half of the project unbuilt
        # on every push. Costs two more build minutes per platform.
        configuration: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Install Windows Driver Kit (IddCx headers)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install windowsdriverkit11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Detect Windows SDK (windows.h)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $kitsRoot = $null
          try {
            $kitsRoot = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" -Name "KitsRoot10" -ErrorAction Stop).KitsRoot10
          } catch {
            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\"
          }

          if (-not $kitsRoot -or -not (Test-Path $kitsRoot)) {
            throw "Windows Kits root not found: $kitsRoot"
          }

          $includeRoot = Join-Path $kitsRoot "Include"
          if (-not (Test-Path $includeRoot)) {
            throw "Windows Kits Include directory not found: $includeRoot"
          }

          $best =
            Get-ChildItem -Path $includeRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            # An SDK is only usable if it has the headers *and* the import libraries the link
            # step needs. um\Windows.h alone can be present in a partial install, and picking
            # that one produced a version whose Lib\ tree was missing.
            Where-Object {
              (Test-Path (Join-Path $_.FullName "um\Windows.h")) -and
              (Test-Path (Join-Path $_.FullName "Lib"))
            } |
            # Sort numerically, not lexicographically: "10.0.9xxx.0" sorts above "10.0.26100.0"
            # as a string, which handed the build an older SDK than the one installed.
            Sort-Object -Property @{ Expression = { [version]$_.Name } } -Descending |
            Select-Object -First 1

          if (-not $best) {
            throw "Could not find an SDK version directory containing um\\Windows.h and Lib\\ under: $includeRoot"
          }

          $sdkVersion = $best.Name
          Write-Output "Using WindowsSdkDir: $kitsRoot"
          Write-Output "Using WindowsTargetPlatformVersion: $sdkVersion"
          "WINDOWS_SDK_DIR=$kitsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_TARGET_PLATFORM_VERSION=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build VDD (${{ matrix.configuration }} | ${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sln = "${{ env.VDD_SOLUTION }}"
          if (-not (Test-Path $sln)) { throw "VDD solution file not found at: $sln" }

          # MttVDD.vcxproj declares UMDF_VERSION_MINOR=25 and that value is what the INF gets
          # stamped with. Do NOT override it here: picking the highest UMDF on the runner built
          # the driver against different headers than a developer's machine and wrote a different
          # UmdfLibraryVersion into the published catalog.
          # Instead, fail fast if the version the project asks for is missing.
          $requiredUmdfMinor = "25"
          $umdfRoots = @(
            (Join-Path $env:WINDOWS_SDK_DIR ("Include\" + $env:WINDOWS_TARGET_PLATFORM_VERSION + "\wdf\umdf")),
            (Join-Path $env:WINDOWS_SDK_DIR "Include\wdf\umdf")
          ) | Where-Object { Test-Path $_ }

          if (-not $umdfRoots -or $umdfRoots.Count -eq 0) {
            throw "UMDF WDF include root not found under $env:WINDOWS_SDK_DIR (tried versioned + unversioned layouts)"
          }

          $umdfRequired = $umdfRoots |
            ForEach-Object { Get-ChildItem -Path $_ -Directory -ErrorAction SilentlyContinue } |
            Where-Object { $_.Name -eq "2.$requiredUmdfMinor" } |
            Select-Object -First 1

          if (-not $umdfRequired) {
            throw "UMDF 2.$requiredUmdfMinor headers required by MttVDD.vcxproj not found under: $($umdfRoots -join ', ')"
          }

          Write-Output "Using UMDF version: $($umdfRequired.Name) from $($umdfRequired.FullName) (matches MttVDD.vcxproj)"

          msbuild $sln `
            /m `
            /t:Build `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="${{ matrix.platform }}" `
            /p:WindowsSdkDir="$env:WINDOWS_SDK_DIR" `
            /p:WindowsTargetPlatformVersion="$env:WINDOWS_TARGET_PLATFORM_VERSION" `
            /verbosity:minimal

      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "Virtual Display Driver (HDR)\${{ matrix.platform }}\${{ matrix.configuration }}\MttVDD"
          if (-not (Test-Path $outDir)) { throw "Build output directory not found: $outDir" }

          # A directory existing says nothing about whether the build produced a driver. Require
          # each artifact the release needs, so a silently-skipped StampInf or Inf2Cat step fails
          # here instead of shipping an artifact that cannot be installed.
          $missing = @()
          foreach ($name in @("MttVDD.dll", "MttVDD.inf", "vdd_settings.xml")) {
            if (-not (Test-Path (Join-Path $outDir $name))) { $missing += $name }
          }
          # The WDK emits the catalog as mttvdd.cat while the INF declares CatalogFile=MttVDD.cat.
          # Windows matches case-insensitively so both work, but the check should not depend on
          # that: look for any .cat rather than one exact spelling.
          if (-not (Get-ChildItem $outDir -Filter *.cat -File)) { $missing += "*.cat" }

          if ($missing.Count -gt 0) {
            $present = ((Get-ChildItem $outDir -File | Select-Object -ExpandProperty Name) -join ', ')
            throw "Missing expected build output(s): $($missing -join ', '). Present: $present"
          }
          Write-Output "Verified build outputs (${{ matrix.configuration }}): dll, inf, cat, vdd_settings.xml"

          $dest = "artifacts\VDD\${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$outDir\*" -Destination $dest -Recurse -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: VDD-${{ matrix.platform }}-${{ matrix.configuration }}
          path: artifacts/VDD/${{ matrix.platform }}/
          if-no-files-found: error
